<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="828px" preserveAspectRatio="none" style="width:781px;height:828px;background:#FFFFFF;" version="1.1" viewBox="0 0 781 828" width="781px" zoomAndPan="magnify"><title>State Machine Diagram &#8212; Reminder (ReminderStatus)</title><defs/><g><g class="title" data-source-line="6"><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="421.6641" x="173.0783" y="25.5">State Machine Diagram &#8212; Reminder (ReminderStatus)</text></g><rect fill="#FFFFFF" height="40" rx="11" ry="11" style="stroke:#000000;stroke-width:0.5;" width="88.9141" x="415.93" y="214.8594"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="78.9141" x="420.93" y="239.5884">SCHEDULED</text><rect fill="#FFFFFF" height="40" rx="11" ry="11" style="stroke:#000000;stroke-width:0.5;" width="50" x="253.43" y="417.3594"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="34.3408" x="261.2596" y="442.0884">SENT</text><rect fill="#FFFFFF" height="40" rx="11" ry="11" style="stroke:#000000;stroke-width:0.5;" width="87.4668" x="485.93" y="605.3594"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="77.4668" x="490.93" y="630.0884">CANCELLED</text><ellipse cx="460.43" cy="56.3594" fill="#000000" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="22" data-uid="ent0003" id="entity_GMN2"><path d="M114.93,609.3594 L114.93,640.918 A11,11 0 0 0 125.93,651.918 L338.8323,651.918 A11,11 0 0 0 349.8323,640.918 L349.8323,608.3594 L339.8323,598.3594 L242.92,598.3594 L273.68,457.5594 L234.92,598.3594 L125.93,598.3594 A11,11 0 0 0 114.93,609.3594" fill="#FFFFFF" style="stroke:#000000;stroke-width:0.5;"/><path d="M339.8323,598.3594 L339.8323,602.8594 A5.5,5.5