<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:text="${title} + ' · Poppy Night'">Poppy Night</title>
    <meta name="description" content="A hand-drawn movie diary and release radar.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
</head>
<body>

<th:block th:fragment="nav(active)">
    <span id="session" hidden
          th:attr="data-auth=${me != null},
                   data-email=${me != null ? me.email : ''},
                   data-user-name=${me != null ? me.displayName : ''},
                   data-avatar-style=${me != null ? me.avatarStyle : ''},
                   data-avatar-color=${me != null ? me.avatarColor : ''},
                   data-fav-genres=${me != null ? me.favoriteGenresJoined : ''}"></span>
    <header class="nav" id="nav">
        <div class="wrap nav-in">
            <nav class="nav-l" aria-label="Main">
                <a th:href="@{/films}" th:classappend="${active == 'films'} ? 'on'">Films</a>
                <a th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'on'">Profile</a>
                <a th:href="@{/diary}" th:classappend="${active == 'diary'} ? 'on'">Diary</a>
            </nav>
            <a class="logo" th:href="@{/films}" aria-label="Cinema Log, home"><span class="logo-mark" data-doodle="logo"></span><span>POPPY NIGHT</span></a>
            <div class="nav-r">
                <button class="icon-btn" data-act="search-open" aria-label="Search movies" aria-haspopup="dialog">
                    <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.1"/><path d="M15 15.2l4.6 4.4"/></svg>
                </button>
                <th:block th:if="${me != null}">
                    <button class="icon-btn" id="bell" data-act="notif" aria-label="Release radar and notifications" aria-haspopup="dialog">
                        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M6.2 16.8c.9-1 1.2-2.1 1.2-4.6 0-3.2 1.9-5.6 4.7-5.7 2.8 0 4.6 2.4 4.6 5.6 0 2.5.4 3.7 1.3 4.7z"/><path d="M5 16.9h14.1M10.3 19.3c.6 1 2.6 1.1 3.4-.1M12 4v2.4"/></svg>
                        <span class="badge-dot" id="bell-dot" hidden></span>
                    </button>
                    <button class="acct" data-act="account" aria-label="Account menu" aria-haspopup="menu">
                        <span id="nav-av"></span>
                        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M6 9.5l6 5.8 6-5.9"/></svg>
                    </button>
                </th:block>
                <a th:unless="${me != null}" class="btn sm" th:href="@{/login}">Log in</a>
            </div>
        </div>
        <div class="squiggle"></div>
    </header>
    <form id="logout-form" th:action="@{/logout}" method="post" hidden></form>
</th:block>

<th:block th:fragment="footer(active)">
    <footer class="foot">
        <div class="squiggle"></div>
        <div class="wrap foot-in">
            <div>
                <a class="logo" th:href="@{/films}"><span class="logo-mark" data-doodle="logo"></span><span>POPPY NIGHT</span></a>
                <p class="tag-line">keep the movies you love.</p>
            </div>
            <div class="foot-links">
                <a href="#">About</a><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Contact</a>
                <a th:href="@{/swagger-ui.html}">API</a>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram ↗</a>
            </div>
            <p class="attrib">
                <span>This product uses the TMDB API but is not endorsed or certified by TMDB.</span>
                <span>CP353002 · Section 03</span>
            </p>
        </div>
    </footer>
    <nav class="tabbar" aria-label="Main">
        <a th:href="@{/films}" th:classappend="${active == 'films'} ? 'on'"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M8 5v14M16 5v14M4 9h4M4 15h4M16 9h4M16 15h4"/></svg>Films</a>
        <a th:href="@{/diary}" th:classappend="${active == 'diary'} ? 'on'"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="1.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>Diary</a>
        <a th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'on'"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><circle cx="12" cy="9" r="3.8"/><path d="M5 19.5c1.2-3.6 4-5.2 7-5.2s5.8 1.6 7 5.2"/></svg>Profile</a>
    </nav>
    <div class="toasts" id="toasts" aria-live="polite"></div>
</th:block>

</body>
</html>
