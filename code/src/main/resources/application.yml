server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: lax          # blocks cross-site POSTs carrying the session cookie (CSRF protection for /api/**)
        http-only: true
  compression:
    enabled: true                 # gzip HTML/CSS/JS/JSON/SVG (about 30 small files per page)
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml

spring:
  application:
    name: cinema-log
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinemalog}
    username: ${DB_USERNAME:cinemalog}
    password: ${DB_PASSWORD:cinemalog}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    open-in-view: false           # all lazy loading happens inside @Transactional services
    hibernate:
      ddl-auto: none              # schema is owned by Flyway migrations only
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
    ignore-migration-patterns: "*:missing"
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}   # set THYMELEAF_CACHE=true on Render
  web:
    resources:
      cache:
        cachecontrol:
          max-age: ${STATIC_MAX_AGE:1h}  # browsers keep CSS/JS/SVG for an hour instead of re-asking every page
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  zone: Asia/Bangkok
  mail-from: ${MAIL_FROM:no-reply@cinemalog.app}
  reminder-cron: "0 0 * * * *"      # check due reminders every hour

tmdb:
  base-url: https://api.themoviedb.org/3
  image-base-url: https://image.tmdb.org/t/p
  api-key: ${TMDB_API_KEY:}         # v3 API key OR v4 read access token — never commit the real value
  language: en-US
  region: TH
  sync-pages: 2
  sync-cron: "0 15 */6 * * *"       # refresh lists every 6 hours

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.cinemalog: INFO
